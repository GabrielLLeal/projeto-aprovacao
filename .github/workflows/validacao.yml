name: Validacao do Projeto Aprovacao

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Instalar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Testar backup e restauracao
        run: node --test tests/*.test.mjs
      - name: Compilar TypeScript e Vite
        run: npm run build
